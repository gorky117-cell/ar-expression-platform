      var p = new URLSearchParams(window.location.search);
      if (!p.has('_cb')) {
        p.set('_cb', Date.now());
        window.location.replace(window.location.pathname + '?' + p.toString());
      }
    })();
  </script>

    html, body {

    /* Hide asset preload container */

      display: none !important;
    }

    /* Camera Video Stream Layer (Background) */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -2 !important;
    }

    /* WebGL A-Frame Canvas Layer (Foreground 3D Overlay) */
    canvas, .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      pointer-events: none !important;

    }
    @keyframes floatParticle4 {
      0%, 100% { transform: translateY(0px) scale(0.85); opacity: 0.75; }
      50% { transform: translateY(16px) scale(1.08); opacity: 1; }
    }

      right: 0;

  <!-- Register A-Frame Components BEFORE scene parses -->
  <script>
    // 1. 6-DOF Exponential Moving Average Matrix Smoother (Silk-smooth jitter filtering)
    AFRAME.registerComponent('matrix-smoother', {
      schema: {
        alpha: { type: 'number', default: 0.18 }
      },
      init: function() {
        this.smoothPos = new THREE.Vector3();
        this.smoothRot = new THREE.Quaternion();
        this.smoothScale = new THREE.Vector3(1, 1, 1);
        this.initialized = false;
      },
      tick: function() {
        const el = this.el;
        if (!el || !el.object3D || !el.object3D.visible) {
          this.initialized = false;
          return;
        }
        if (!this.initialized) {
          this.smoothPos.copy(el.object3D.position);
          this.smoothRot.copy(el.object3D.quaternion);
          this.smoothScale.copy(el.object3D.scale);
          this.initialized = true;
          return;
        }
        const alpha = this.data.alpha;
        this.smoothPos.lerp(el.object3D.position, alpha);
        this.smoothRot.slerp(el.object3D.quaternion, alpha);
        this.smoothScale.lerp(el.object3D.scale, alpha);

        el.object3D.position.copy(this.smoothPos);
        el.object3D.quaternion.copy(this.smoothRot);
        el.object3D.scale.copy(this.smoothScale);
      }
    });

    // 2. Distance Auto-Scaler & Auto-Zooming Engine (Scales story pill & particles up to 2.5x from 10+ ft away)
    AFRAME.registerComponent('distance-auto-scaler', {
      schema: {
        minScale: { type: 'number', default: 1.0 },
        maxScale: { type: 'number', default: 2.5 }
      },
      tick: function() {
        const sceneEl = this.el.sceneEl;
        if (!sceneEl || !sceneEl.camera || !this.el.object3D) return;
        const cameraObj = sceneEl.camera;

        const cameraWorldPos = new THREE.Vector3();
        cameraObj.getWorldPosition(cameraWorldPos);

        const targetWorldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(targetWorldPos);

        const distMeters = cameraWorldPos.distanceTo(targetWorldPos);
        const distFeet = distMeters * 3.28084;

        // Scale Formula: ScaleFactor = clamp(1.0 + 0.12 * (DistanceInFeet - 2.0), 1.0, 2.5)
        let rawScale = 1.0 + 0.12 * Math.max(0, distFeet - 2.0);
        let clampedScale = Math.min(Math.max(rawScale, this.data.minScale), this.data.maxScale);

        // Apply auto-scale to child elements
        const pillEl = this.el.querySelector('[id*="PillBorder3D"]')?.parentElement;
        if (pillEl && pillEl.object3D) {
          pillEl.object3D.scale.set(clampedScale, clampedScale, clampedScale);
        }
      }
    });
  </script>

      <a-text id="bfParticle2" value="✨" position="0.45 0.30 0.08" align="center" width="1.8" animation="property: position; from: 0.45 0.40 0.08; to: 0.45 0.10 0.08; dir: alternate; dur: 1900; loop: true; easing: easeInOutSine"></a-text>
      <a-text id="bfParticle3" value="✨" position="-0.38 -0.25 0.08" align="center" width="1.5" animation="property: position; from: -0.38 -0.10 0.08; to: -0.38 -0.40 0.08; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine"></a-text>
      <a-text id="bfParticle4" value="✨" position="0.38 -0.28 0.08" align="center" width="1.5" animation="property: position; from: 0.38 -0.12 0.08; to: 0.38 -0.42 0.08; dir: alternate; dur: 2100; loop: true; easing: easeInOutSine"></a-text>

      <!-- 4. Floating Story Badge (Pill matching Image 2 line 322) -->

      <a-text id="treeParticle2" value="🍃" position="0.45 0.30 0.08" align="center" width="1.8" animation="property: position; from: 0.45 0.40 0.08; to: 0.45 0.10 0.08; dir: alternate; dur: 1900; loop: true; easing: easeInOutSine"></a-text>

      <a-text id="treeParticle4" value="🍃" position="0.38 -0.28 0.08" align="center" width="1.5" animation="property: position; from: 0.38 -0.12 0.08; to: 0.38 -0.42 0.08; dir: alternate; dur: 2100; loop: true; easing: easeInOutSine"></a-text>

      <!-- 4. Floating Story Badge -->

  <script>
    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let activeExpressionId = null;
    let pollingStarted = false;
    let urlExpressionId = null;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlCaption = urlParams.get('caption');
      const urlMood = urlParams.get('mood');
      const urlId = urlParams.get('id');
      const urlOverlay = decodeURIComponent(urlParams.get('overlay') || '');

      if (urlId) {
        urlExpressionId = parseInt(urlId, 10) || urlId;
        activeExpressionId = urlExpressionId;
      }

      if (urlCaption) {
        const storyText = `💬 "${urlCaption}"`;
        const bf3D = document.getElementById('butterflyText3D');
        const tr3D = document.getElementById('treeText3D');
        if (bf3D) bf3D.setAttribute('value', storyText);
        if (tr3D) tr3D.setAttribute('value', storyText);
      }

      if (urlMood) {
        let moodColor = '#10b981';
        let particleChar = '🍃';
        const m = urlMood.toLowerCase();
        if (m === 'inspired' || m === 'galactic') { moodColor = '#00f0ff'; particleChar = '✨'; }
        else if (m === 'happy' || m === 'solar-beams' || m === 'hyperdrive') { moodColor = '#f59e0b'; particleChar = '⚡'; }
        else if (m === 'playful' || m === 'micro-swarm' || m === 'leaf-whirlwind') { moodColor = '#ec4899'; particleChar = '🎨'; }
        else if (m === 'peaceful' || m === 'zenith' || m === 'starlight-roots') { moodColor = '#6366f1'; particleChar = '🧘'; }

        ['butterflyAura3D', 'treeAura3D'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.setAttribute('material', 'color', moodColor);
        });
        ['butterflyPillBorder3D', 'treePillBorder3D'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.setAttribute('material', 'color', moodColor);
        });
        ['particle1', 'particle2', 'particle3', 'particle4'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.textContent = particleChar;
        });
      }

      const bf = document.getElementById('targetButterfly');
      const tr = document.getElementById('targetTree');

      if (bf) {
        bf.addEventListener('targetFound', async () => {
          console.log('Cosmic Butterfly Target Found!');
          document.getElementById('arTitleBadge').textContent = '🦋 Cosmic Butterfly AR';
          const pOverlay = document.getElementById('particleOverlay');
          if (pOverlay) pOverlay.style.display = 'block';
          if (!urlExpressionId && supabaseClient) {
            const { data: list } = await supabaseClient
              .from('expressions')
              .select('*')
              .ilike('overlay_image', '%butterfly%')
              .order('created_at', { ascending: false })
              .limit(1);
            if (list && list.length > 0) {
              activeExpressionId = list[0].id;
            } else {
              activeExpressionId = null;
              document.getElementById('expCaption').innerHTML = '✨ Expression yet to be created by wearer. <a href="/create" style="color:#7c5cff; font-weight:700; text-decoration:underline;">+ Create Story</a>';
              const bf3D = document.getElementById('butterflyText3D');
              if (bf3D) bf3D.setAttribute('value', '💬 "Expression yet to be created by wearer"');
              document.getElementById('likeCount').textContent = '0';
              document.getElementById('waveCount').textContent = '0';
            }
          }
          startPolling();
          pollData();
        });
        bf.addEventListener('targetLost', () => {
          const pOverlay = document.getElementById('particleOverlay');
          if (pOverlay) pOverlay.style.display = 'none';
          if (!urlCaption) document.getElementById('expCaption').textContent = '✨ Point camera at artwork print';
        });
      }

      if (tr) {
        tr.addEventListener('targetFound', async () => {
          console.log('Test Tree Target Found!');
          document.getElementById('arTitleBadge').textContent = '🌳 Test Tree AR';
          const pOverlay = document.getElementById('particleOverlay');
          if (pOverlay) pOverlay.style.display = 'block';
          if (!urlExpressionId && supabaseClient) {
            const { data: list } = await supabaseClient
              .from('expressions')
              .select('*')
              .ilike('overlay_image', '%tree%')
              .order('created_at', { ascending: false })
              .limit(1);
            if (list && list.length > 0) {
              activeExpressionId = list[0].id;
            } else {
              activeExpressionId = null;
              document.getElementById('expCaption').innerHTML = '✨ Expression yet to be created by wearer. <a href="/create" style="color:#7c5cff; font-weight:700; text-decoration:underline;">+ Create Story</a>';
              const tr3D = document.getElementById('treeText3D');
              if (tr3D) tr3D.setAttribute('value', '💬 "Expression yet to be created by wearer"');
              document.getElementById('likeCount').textContent = '0';
              document.getElementById('waveCount').textContent = '0';
            }
          }
          startPolling();
          pollData();
        });
        tr.addEventListener('targetLost', () => {
          const pOverlay = document.getElementById('particleOverlay');
          if (pOverlay) pOverlay.style.display = 'none';
          if (!urlCaption) document.getElementById('expCaption').textContent = '✨ Point camera at artwork print';
        });
      }

      initSupabase();
    });

    let supabaseClient = null;

    function startPolling() {
      if (!pollingStarted && supabaseClient) {
        pollingStarted = true;
        setInterval(pollData, 500);
      }
    }

    async function initSupabase() {
      try {
        let sbUrl = 'https://pbfhgpitghiwkelhzssz.supabase.co';
        let sbKey = 'sb_publishable_9UC-fIvJNypRa6oIpZBXlw_dHpB9OUm';
        try {
          const res = await fetch('/api/config');
          const config = await res.json();
          if (config.supabaseUrl && config.supabaseKey) {
            sbUrl = config.supabaseUrl;
            sbKey = config.supabaseKey;
          }
        } catch (e) {}

        if (window.supabase) {
          supabaseClient = window.supabase.createClient(sbUrl, sbKey);
          if (urlExpressionId) {
            startPolling();
            pollData();
          }
        }
      } catch (err) {
        console.error('Supabase init error:', err);
      }
    }

    async function pollData() {
      if (!supabaseClient || activeExpressionId === null) return;
      try {
        let latest = null;

        if (urlExpressionId) {
          const { data: row } = await supabaseClient
            .from('expressions')
            .select('*')
            .eq('id', urlExpressionId)
            .single();
          if (row) latest = row;
        }

        if (!latest) {
          const overlayPath = activeExpressionId == 1 ? '/overlays/tree-birds-target.png' : '/overlays/cosmic-butterfly.svg';
          const { data: exprList } = await supabaseClient
            .from('expressions')
            .select('*')
            .eq('overlay_image', overlayPath)
            .order('created_at', { ascending: false })
            .limit(1);
          if (exprList && exprList.length > 0) latest = exprList[0];
        }

        if (latest) {
          if (!urlExpressionId && latest.id) {
            activeExpressionId = latest.id;
          }

          const storyText = latest.caption ? `💬 "${latest.caption}"` : `💬 "Your 3D AR story floats here"`;
          document.getElementById('expCaption').textContent = `✨ AR Target Active (${(latest.mood || 'active').toUpperCase()})`;

          const butterfly3D = document.getElementById('butterflyText3D');
          const tree3D = document.getElementById('treeText3D');
          if (butterfly3D) butterfly3D.setAttribute('value', storyText);
          if (tree3D) tree3D.setAttribute('value', storyText);

          let moodColor = '#10b981';
          let particleChar = '🍃';

          const m = (latest.mood || '').toLowerCase();
          if (m === 'inspired' || m === 'galactic') {
            moodColor = '#00f0ff';
            particleChar = '✨';
          } else if (m === 'happy' || m === 'solar-beams' || m === 'hyperdrive') {
            moodColor = '#f59e0b';
            particleChar = '⚡';
          } else if (m === 'playful' || m === 'micro-swarm' || m === 'leaf-whirlwind') {
            moodColor = '#ec4899';
            particleChar = '🎨';
          } else if (m === 'peaceful' || m === 'zenith' || m === 'starlight-roots') {
            moodColor = '#6366f1';
            particleChar = '🧘';
          }

          ['butterflyAura3D', 'treeAura3D'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.setAttribute('material', 'color', moodColor);
          });

          ['butterflyPillBorder3D', 'treePillBorder3D'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.setAttribute('material', 'color', moodColor);
          });


          ['particle1', 'particle2', 'particle3', 'particle4'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = particleChar;
          });
        }

        const reactionExprId = urlExpressionId || activeExpressionId;
        const { data: reactions } = await supabaseClient
          .from('reactions')
          .select('*')
          .eq('expression_id', reactionExprId);

        if (reactions) {
          const likes = reactions.filter(r => r.kind === 'like').length;
          const waves = reactions.filter(r => r.kind === 'greeting').length;
          const comments = reactions.filter(r => r.kind === 'comment');

          document.getElementById('likeCount').textContent = likes;
          document.getElementById('waveCount').textContent = waves;

          if (comments.length > 0) {
            document.getElementById('commentsFeed').innerHTML = comments.slice().reverse().map(c => `
              <div class="comment-item">
                <strong class="comment-author">${escapeHtml(c.author || 'Viewer')}:</strong>
                <span>${escapeHtml(c.text || '')}</span>
              </div>
            `).join('');
          } else {
            document.getElementById('commentsFeed').innerHTML = `<p style="color: #7a7f90; font-size: 13px; text-align: center;">No comments yet. Leave the first one!</p>`;
          }
        }
      } catch (err) {
        console.error('Poll error:', err);
      }
    }

    async function handleLike() {
      const el = document.getElementById('likeCount');
      el.textContent = parseInt(el.textContent) + 1;
      if (supabaseClient) {
        await supabaseClient.from('reactions').insert({ expression_id: urlExpressionId || activeExpressionId, kind: 'like' });
      }
    }

    async function handleWave() {
      const el = document.getElementById('waveCount');
      el.textContent = parseInt(el.textContent) + 1;
      if (supabaseClient) {
        await supabaseClient.from('reactions').insert({ expression_id: urlExpressionId || activeExpressionId, kind: 'greeting' });
      }
    }

    function openCommentModal() {
      document.getElementById('commentModal').classList.add('active');
    }

    function closeCommentModal(event) {
      if (!event || event.target === document.getElementById('commentModal')) {
        document.getElementById('commentModal').classList.remove('active');
      }
    }

    async function submitComment() {
      const author = document.getElementById('commentAuthorInput').value.trim() || 'Viewer';
      const text = document.getElementById('commentTextInput').value.trim();
      if (!text) return;

      const feed = document.getElementById('commentsFeed');
      const emptyMsg = feed.querySelector('p');
      if (emptyMsg) emptyMsg.remove();

      const newItem = document.createElement('div');
      newItem.className = 'comment-item';
      newItem.innerHTML = `<strong class="comment-author">${escapeHtml(author)}:</strong> <span>${escapeHtml(text)}</span>`;
      feed.insertBefore(newItem, feed.firstChild);

      if (supabaseClient) {
        await supabaseClient.from('reactions').insert({
          expression_id: urlExpressionId || activeExpressionId,
          kind: 'comment',
          author,
          text
        });
      }
    }
  </script>

</body>
</html>
