<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#ddd6fe" opacity="0.1"/>
  <!-- Central Crystal Octahedron -->
  <polygon points="100,20 150,100 100,120" fill="#a78bfa" opacity="0.9"/>
  <polygon points="100,20 50,100 100,120" fill="#c084fc" opacity="0.8"/>
  <polygon points="100,180 150,100 100,120" fill="#818cf8" opacity="0.9"/>
  <polygon points="100,180 50,100 100,120" fill="#6366f1" opacity="0.85"/>
  <!-- Orbiting Nodes -->
  <circle cx="160" cy="50" r="8" fill="#f472b6"/>
  <circle cx="40" cy="150" r="10" fill="#60a5fa"/>
  <line x1="100" y1="20" x2="160" y2="50" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="100" y1="180" x2="40" y2="150" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
</svg>
