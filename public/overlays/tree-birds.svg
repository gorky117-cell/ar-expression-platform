<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Solid Dark Theme Background -->
  <rect width="400" height="400" fill="#121218"/>

  <!-- Sleek Outer Poster Frame & Corner Keypoint Dots (Option 1) -->
  <rect x="16" y="16" width="368" height="368" rx="12" fill="none" stroke="#7C5CFF" stroke-width="2.5" opacity="0.85"/>
  <circle cx="16" cy="16" r="5" fill="#7C5CFF"/>
  <circle cx="384" cy="16" r="5" fill="#7C5CFF"/>
  <circle cx="16" cy="384" r="5" fill="#7C5CFF"/>
  <circle cx="384" cy="384" r="5" fill="#7C5CFF"/>

  <!-- Pure Original Simple Tree Artwork -->
  <rect x="170" y="240" width="60" height="130" fill="#5D4037"/>
  <ellipse cx="200" cy="160" rx="110" ry="130" fill="#2E7D32"/>
  <ellipse cx="200" cy="140" rx="90" ry="110" fill="#388E3C"/>
  <ellipse cx="200" cy="120" rx="70" ry="90" fill="#43A047"/>

  <!-- 3 Accent Circles -->
  <circle cx="150" cy="110" r="24" fill="#34d399" opacity="0.95"/>
  <circle cx="240" cy="130" r="20" fill="#34d399" opacity="0.95"/>
  <circle cx="190" cy="80" r="16" fill="#34d399" opacity="0.95"/>

  <!-- Eye-like curves -->
  <path d="M140 110 Q150 100 160 110" stroke="#1a1a20" stroke-width="3" fill="none"/>
  <path d="M230 130 Q240 120 250 130" stroke="#1a1a20" stroke-width="3" fill="none"/>
</svg>
