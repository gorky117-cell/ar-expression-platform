<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Solid Dark Backdrop -->
  <rect width="400" height="400" fill="#0f0f14"/>

  <!-- Geometric Celestial Ring System (High Entropy Feature Point Anchor) -->
  <circle cx="200" cy="180" r="150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="200" cy="180" r="140" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="180" r="160" fill="none" stroke="#ec4899" stroke-width="0.8" stroke-dasharray="2 8" opacity="0.7"/>

  <!-- Starburst & Constellation Corner Crosshairs -->
  <path d="M 200 15 L 200 30 M 200 330 L 200 345 M 35 180 L 50 180 M 350 180 L 365 180" stroke="#f43f5e" stroke-width="2"/>
  <circle cx="50" cy="50" r="3" fill="#6366f1"/>
  <circle cx="350" cy="50" r="3" fill="#a855f7"/>
  <circle cx="50" cy="310" r="3" fill="#ec4899"/>
  <circle cx="350" cy="310" r="3" fill="#3b82f6"/>
  <line x1="50" y1="50" x2="80" y2="80" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="350" y1="50" x2="320" y2="80" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Intricate Tree Roots & Trunk Network -->
  <path d="M 175 320 C 175 270, 185 240, 185 210 L 215 210 C 215 240, 225 270, 225 320 Z" fill="#451a03"/>
  <path d="M 185 300 Q 150 325 120 335 M 195 310 Q 180 340 160 355 M 205 310 Q 220 340 240 355 M 215 300 Q 250 325 280 335" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Detailed Branch Lattice -->
  <path d="M 190 220 C 160 190, 130 180, 105 175 M 180 200 C 150 160, 120 140, 90 130 M 210 220 C 240 190, 270 180, 295 175 M 220 200 C 250 160, 280 140, 310 130" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Foliage Layer 1 - Deep Emerald Canopy -->
  <path d="M 200 40 C 120 40, 70 100, 70 170 C 70 230, 130 250, 200 250 C 270 250, 330 230, 330 170 C 330 100, 280 40, 200 40 Z" fill="#065f46" opacity="0.9"/>

  <!-- Foliage Layer 2 - Textured Mid-Green Clusters -->
  <circle cx="150" cy="110" r="45" fill="#047857"/>
  <circle cx="250" cy="110" r="45" fill="#047857"/>
  <circle cx="200" cy="90" r="50" fill="#059669"/>
  <circle cx="120" cy="160" r="40" fill="#10b981"/>
  <circle cx="280" cy="160" r="40" fill="#10b981"/>
  <circle cx="200" cy="170" r="55" fill="#34d399"/>

  <!-- Intricate Stipple & Foliage Textures (High Frequency Corners) -->
  <g fill="#ecfdf5" opacity="0.85">
    <!-- Leaf Clusters & Dots -->
    <circle cx="140" cy="90" r="4"/><circle cx="160" cy="80" r="5"/><circle cx="180" cy="70" r="6"/>
    <circle cx="220" cy="70" r="6"/><circle cx="240" cy="80" r="5"/><circle cx="260" cy="90" r="4"/>
    <circle cx="110" cy="130" r="5"/><circle cx="130" cy="140" r="4"/><circle cx="150" cy="120" r="6"/>
    <circle cx="250" cy="120" r="6"/><circle cx="270" cy="140" r="4"/><circle cx="290" cy="130" r="5"/>
    <circle cx="170" cy="160" r="5"/><circle cx="200" cy="140" r="7"/><circle cx="230" cy="160" r="5"/>
    <!-- Micro Details -->
    <polygon points="195,65 200,55 205,65 200,75" fill="#fef08a"/>
    <polygon points="145,115 150,105 155,115 150,125" fill="#fef08a"/>
    <polygon points="245,115 250,105 255,115 250,125" fill="#fef08a"/>
  </g>

  <!-- Birds Silhouette Flock in Sky -->
  <path d="M 120 75 Q 128 65 136 75 Q 144 65 152 75" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M 240 70 Q 248 60 256 70 Q 264 60 272 70" stroke="#f8fafc" stroke-width="2" fill="none"/>
  <path d="M 185 50 Q 191 42 197 50 Q 203 42 209 50" stroke="#f8fafc" stroke-width="1.8" fill="none"/>

  <!-- High-Contrast Streetwear Typography Banner -->
  <rect x="70" y="350" width="260" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="368" font-family="'Courier New', monospace" font-weight="900" font-size="13" fill="#f8fafc" text-anchor="middle" letter-spacing="3">WEARWAVE • TREE AR</text>
</svg>
