<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Solid Dark Theme Background -->
  <rect width="400" height="400" fill="#121218"/>

  <!-- Pure Original Simple Tree Artwork -->
  <rect x="150" y="220" width="60" height="130" fill="#5D4037"/>
  <ellipse cx="180" cy="140" rx="110" ry="130" fill="#2E7D32"/>
  <ellipse cx="180" cy="120" rx="90" ry="110" fill="#388E3C"/>
  <ellipse cx="180" cy="100" rx="70" ry="90" fill="#43A047"/>

  <!-- 3 Accent Circles -->
  <circle cx="130" cy="90" r="24" fill="#34d399" opacity="0.95"/>
  <circle cx="220" cy="110" r="20" fill="#34d399" opacity="0.95"/>
  <circle cx="170" cy="60" r="16" fill="#34d399" opacity="0.95"/>

  <!-- Eye-like curves -->
  <path d="M120 90 Q130 80 140 90" stroke="#1a1a20" stroke-width="3" fill="none"/>
  <path d="M210 110 Q220 100 230 110" stroke="#1a1a20" stroke-width="3" fill="none"/>

</svg>
