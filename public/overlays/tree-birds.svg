<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Solid Dark Background -->
  <rect width="400" height="400" fill="#121218"/>

  <!-- Original Simple Tree Artwork -->
  <rect x="170" y="240" width="60" height="130" fill="#5D4037"/>
  <ellipse cx="200" cy="160" rx="110" ry="130" fill="#2E7D32"/>
  <ellipse cx="200" cy="140" rx="90" ry="110" fill="#388E3C"/>
  <ellipse cx="200" cy="120" rx="70" ry="90" fill="#43A047"/>

  <!-- Decorative Accent Circles -->
  <circle cx="150" cy="110" r="24" fill="#34d399" opacity="0.95"/>
  <circle cx="240" cy="130" r="20" fill="#34d399" opacity="0.95"/>
  <circle cx="190" cy="80" r="16" fill="#34d399" opacity="0.95"/>

  <!-- Eye-like curves -->
  <path d="M140 110 Q150 100 160 110" stroke="#1a1a20" stroke-width="3" fill="none"/>
  <path d="M230 130 Q240 120 250 130" stroke="#1a1a20" stroke-width="3" fill="none"/>

  <!-- Streetwear Corner AR Authenticator Tag (Hiro Marker) -->
  <g transform="translate(305, 305)">
    <!-- Outer Black Border -->
    <rect x="0" y="0" width="80" height="80" fill="#000000" rx="4"/>
    <!-- Inner White Margin -->
    <rect x="10" y="10" width="60" height="60" fill="#ffffff"/>
    <!-- Hiro Inner Black Block -->
    <rect x="20" y="20" width="40" height="40" fill="#000000"/>
    <!-- Hiro Inner White Cutouts -->
    <rect x="25" y="25" width="30" height="15" fill="#ffffff"/>
    <rect x="25" y="45" width="15" height="10" fill="#ffffff"/>
    <!-- Label -->
    <text x="40" y="-6" font-family="monospace" font-size="7" font-weight="700" fill="#8888a0" text-anchor="middle" letter-spacing="1">SCAN AR</text>
  </g>
</svg>
