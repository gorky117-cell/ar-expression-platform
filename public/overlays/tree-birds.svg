<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Solid dark background matching the Web UI theme to ensure consistent compilation contrast -->
  <rect width="200" height="200" fill="#121218" />

  <!-- Subtle Grid Pattern in background to add high-frequency tracking points -->
  <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.15"/>
  </pattern>
  <rect width="200" height="200" fill="url(#grid)" />

  <!-- Outer Geometric Tracking Ring in high-contrast light-gray -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Registration marks for tracking stability in high-contrast light-gray -->
  <path d="M 100 2 L 100 8 M 100 192 L 100 198 M 2 100 L 8 100 M 192 100 L 198 100" stroke="#cbd5e1" stroke-width="1" opacity="0.7"/>

  <!-- Core Artwork -->
  <rect x="85" y="120" width="30" height="80" fill="#5D4037"/>
  <ellipse cx="100" cy="80" rx="55" ry="65" fill="#2E7D32"/>
  <ellipse cx="100" cy="70" rx="45" ry="55" fill="#388E3C"/>
  <ellipse cx="100" cy="60" rx="35" ry="45" fill="#43A047"/>
  <circle cx="75" cy="55" r="12" fill="#34d399" opacity="0.95"/>
  <circle cx="120" cy="65" r="10" fill="#34d399" opacity="0.95"/>
  <circle cx="95" cy="40" r="8" fill="#34d399" opacity="0.95"/>
  <path d="M70 55 Q75 50 80 55" stroke="#1a1a20" stroke-width="1.5" fill="none"/>
  <path d="M115 65 Q120 60 125 65" stroke="#1a1a20" stroke-width="1.5" fill="none"/>

  <!-- Aesthetic text details for tracking in high-contrast light-gray -->
  <text x="100" y="175" font-family="monospace" font-size="6" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.5" opacity="0.8">WEARWAVE AR</text>
  <text x="100" y="183" font-family="monospace" font-size="5" fill="#cbd5e1" text-anchor="middle" letter-spacing="1" opacity="0.6">CALM CANOPY</text>
</svg>
