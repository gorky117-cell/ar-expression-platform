<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Dark Cosmic Background -->
  <rect width="500" height="500" fill="#0B0B12"/>

  <!-- Glowing Starfield background constellation keypoints -->
  <circle cx="80" cy="90" r="3" fill="#A78BFA" opacity="0.9"/>
  <circle cx="420" cy="80" r="4" fill="#38BDF8" opacity="0.8"/>
  <circle cx="70" cy="410" r="3.5" fill="#F472B6" opacity="0.9"/>
  <circle cx="430" cy="420" r="3" fill="#A78BFA" opacity="0.8"/>
  <circle cx="250" cy="40" r="5" fill="#38BDF8" opacity="0.9"/>
  
  <line x1="80" y1="90" x2="140" y2="130" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="420" y1="80" x2="360" y2="120" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Central Geometric Monarch Butterfly Wings (Rich Keypoint Geometry) -->
  <!-- Left Upper Wing -->
  <polygon points="250,230 110,100 60,180 180,250" fill="url(#leftUpperGrad)" stroke="#A78BFA" stroke-width="3"/>
  <!-- Left Lower Wing -->
  <polygon points="250,250 120,270 90,380 220,320" fill="url(#leftLowerGrad)" stroke="#F472B6" stroke-width="3"/>

  <!-- Right Upper Wing -->
  <polygon points="250,230 390,100 440,180 320,250" fill="url(#rightUpperGrad)" stroke="#A78BFA" stroke-width="3"/>
  <!-- Right Lower Wing -->
  <polygon points="250,250 380,270 410,380 280,320" fill="url(#rightLowerGrad)" stroke="#38BDF8" stroke-width="3"/>

  <!-- Wing Inner Geometric Patterns for High Feature Density -->
  <circle cx="160" cy="160" r="18" fill="#F472B6" opacity="0.9"/>
  <circle cx="340" cy="160" r="18" fill="#F472B6" opacity="0.9"/>
  <circle cx="170" cy="310" r="14" fill="#38BDF8" opacity="0.9"/>
  <circle cx="330" cy="310" r="14" fill="#A78BFA" opacity="0.9"/>

  <polygon points="160,160 210,210 140,220" fill="#38BDF8" opacity="0.8"/>
  <polygon points="340,160 290,210 360,220" fill="#38BDF8" opacity="0.8"/>

  <!-- Butterfly Body & Antennae -->
  <ellipse cx="250" cy="250" rx="10" ry="60" fill="#FFFFFF"/>
  <circle cx="250" cy="180" r="14" fill="#FFFFFF"/>
  
  <path d="M245 170 Q210 120 190 110" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M255 170 Q290 120 310 110" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="190" cy="110" r="5" fill="#A78BFA"/>
  <circle cx="310" cy="110" r="5" fill="#A78BFA"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="leftUpperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="rightUpperGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="leftLowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="rightLowerGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
</svg>
