<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Pure Markerless WebAR View — Cosmic Butterfly</title>

  <!-- A-Frame 1.3.0 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- MindAR Engine for Pure Markerless Image Tracking (Hosted Locally) -->
  <script src="/js/mindar-image-aframe.prod.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0b0b12 !important;
    }

    /* Camera Video Stream Layer (Background) */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -2 !important;
    }

    /* WebGL A-Frame Canvas Layer (Foreground 3D Overlay) */
    canvas,
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      pointer-events: none !important;
    }

    .ui-header {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Social Bottom Actions Bar */
    .ar-social-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 12px;
      background: rgba(18, 18, 24, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .ar-action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .ar-action-btn:active {
      transform: scale(0.94);
      background: #7c5cff;
    }

    /* Comments Modal */
    .comment-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .comment-modal.active {
      display: flex;
    }

    .comment-card {
      background: #181820;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .comment-feed {
      max-height: 180px;
      overflow-y: auto;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .comment-author {
      color: #38bdf8;
      font-weight: 700;
      margin-right: 6px;
    }
  </style>
</head>

<body>
  <!-- Top UI Header -->
  <div class="ui-header">
    <div>
      <div style="font-weight: 800; font-size: 16px;" id="expTitle">Cosmic Butterfly</div>
      <div style="color: #a78bfa; font-size: 12px; margin-top: 2px;" id="expCaption">✨ Point camera at clean butterfly artwork</div>
    </div>
    <a href="/feed" style="color: #7c5cff; font-weight: 700; font-size: 12px; text-decoration: none; background: rgba(124, 92, 255, 0.15); padding: 6px 12px; border-radius: 9999px; border: 1px solid rgba(124, 92, 255, 0.3);">Feed</a>
  </div>

  <!-- Bottom Social Action Bar -->
  <div class="ar-social-bar">
    <button class="ar-action-btn" onclick="handleLike()">
      ❤️ <span id="likeCount">5</span>
    </button>
    <button class="ar-action-btn" onclick="handleWave()">
      👋 <span id="waveCount">3</span>
    </button>
    <button class="ar-action-btn" onclick="openCommentModal()">
      💬 Comments
    </button>
  </div>

  <!-- Comments Modal -->
  <div class="comment-modal" id="commentModal" onclick="closeCommentModal(event)">
    <div class="comment-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 1.1rem; font-weight: 800;">Viewer Comments</h3>
        <button onclick="closeCommentModal()" style="background: none; border: none; color: #8888a0; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>

      <div class="comment-feed" id="commentsFeed">
        <div class="comment-item">
          <strong class="comment-author">WebAR Fans:</strong>
          <span>Pure markerless tracking is amazing!</span>
        </div>
      </div>

      <input type="text" id="commentAuthorInput" placeholder="Your Name" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 8px; box-sizing: border-box;" />
      <textarea id="commentTextInput" placeholder="Write a comment..." rows="2" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; margin-bottom: 12px; box-sizing: border-box; resize: none;"></textarea>

      <button id="submitCommentBtn" onclick="submitComment()" style="width: 100%; padding: 10px; background: #7c5cff; color: #fff; border: none; border-radius: 9999px; font-weight: 700; cursor: pointer;">
        Post Comment
      </button>
    </div>
  </div>

  <a-scene mindar-image="imageTargetSrc: /data/targets/cosmic-butterfly.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <img id="butterflyTex" src="/overlays/cosmic-butterfly.svg">
      <img id="leftWingTex" src="/overlays/butterfly-left-wing.svg">
      <img id="rightWingTex" src="/overlays/butterfly-right-wing.svg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; color: #ffffff; intensity: 0.95;"></a-entity>
    <a-entity light="type: directional; color: #a78bfa; intensity: 1.5;" position="1 2 3"></a-entity>

    <!-- Target 0 Anchor: Point camera at the 100% clean cosmic butterfly image -->
    <a-entity mindar-image-target="targetIndex: 0" id="mindTarget">
      <!-- 1. Floating 3D Live Comment Text Banner Floating in Space -->
      <a-text id="ar3DCommentText" value="💬 Pure Markerless Tracking Active!" position="0 0.85 0.2" align="center" color="#34d399" scale="0.95 0.95 0.95" animation="property: position; from: 0 0.85 0.2; to: 0 0.95 0.25; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine"></a-text>

      <!-- 2. Center Butterfly Body Base (Stationary Artwork Base) -->
      <a-plane position="0 0 0.02" width="1.0" height="1.0" material="shader: flat; src: #butterflyTex; transparent: true; opacity: 0.95"></a-plane>

      <!-- 3. Realistic 3D Flapping Left Wing Hinge (Controlled 45° Flap Rotation) -->
      <a-entity id="leftWingPivot" position="0 0 0.05" animation="property: rotation; from: 0 0 0; to: 0 45 0; dir: alternate; dur: 550; loop: true; easing: easeInOutSine">
        <a-plane position="-0.25 0 0" width="0.5" height="1.0" material="shader: flat; src: #leftWingTex; transparent: true; opacity: 0.95"></a-plane>
      </a-entity>

      <!-- 4. Realistic 3D Flapping Right Wing Hinge (Controlled 45° Flap Rotation) -->
      <a-entity id="rightWingPivot" position="0 0 0.05" animation="property: rotation; from: 0 0 0; to: 0 -45 0; dir: alternate; dur: 550; loop: true; easing: easeInOutSine">
        <a-plane position="0.25 0 0" width="0.5" height="1.0" material="shader: flat; src: #rightWingTex; transparent: true; opacity: 0.95"></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const targetEntity = document.getElementById('mindTarget');
    if (targetEntity) {
      targetEntity.addEventListener('targetFound', () => {
        console.log('MindAR Pure Image Target Found!');
        const captionEl = document.getElementById('expCaption');
        if (captionEl) captionEl.textContent = '✨ AR Pure Markerless Active!';
      });
      targetEntity.addEventListener('targetLost', () => {
        console.log('MindAR Target Lost!');
        const captionEl = document.getElementById('expCaption');
        if (captionEl) captionEl.textContent = '✨ Point camera at clean butterfly artwork';
      });
    }

    const expressionId = 'cosmic-butterfly';
    let supabaseClient = null;

    async function initSupabase() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.supabaseUrl && config.supabaseKey) {
          supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseKey);
          pollData();
          setInterval(pollData, 500); // 500ms ultra-fast free tier sync
        }
      } catch (err) {
        console.error('Supabase init error:', err);
      }
    }

    async function pollData() {
      if (!supabaseClient) return;
      try {
        const { data: reactions } = await supabaseClient
          .from('reactions')
          .select('*')
          .eq('expression_id', expressionId);

        if (reactions) {
          const likes = reactions.filter(r => r.kind === 'like').length + 5;
          const waves = reactions.filter(r => r.kind === 'greeting').length + 3;
          const comments = reactions.filter(r => r.kind === 'comment');

          document.getElementById('likeCount').textContent = likes;
          document.getElementById('waveCount').textContent = waves;

          if (comments.length > 0) {
            const latest = comments[comments.length - 1];
            const ar3DText = document.getElementById('ar3DCommentText');
            if (ar3DText && latest.text) {
              ar3DText.setAttribute('value', '💬 ' + latest.text);
            }

            document.getElementById('commentsFeed').innerHTML = comments.slice().reverse().map(c => `
              <div class="comment-item">
                <strong class="comment-author">${escapeHtml(c.author || 'Viewer')}:</strong>
                <span>${escapeHtml(c.text || '')}</span>
              </div>
            `).join('');
          }
        }
      } catch (err) {
        console.error('Poll error:', err);
      }
    }

    async function handleLike() {
      const el = document.getElementById('likeCount');
      el.textContent = parseInt(el.textContent) + 1;
      if (supabaseClient) {
        await supabaseClient.from('reactions').insert({ expression_id: expressionId, kind: 'like' });
      }
    }

    async function handleWave() {
      const el = document.getElementById('waveCount');
      el.textContent = parseInt(el.textContent) + 1;
      if (supabaseClient) {
        await supabaseClient.from('reactions').insert({ expression_id: expressionId, kind: 'greeting' });
      }
    }

    function openCommentModal() {
      document.getElementById('commentModal').classList.add('active');
    }

    function closeCommentModal(event) {
      if (!event || event.target === document.getElementById('commentModal')) {
        document.getElementById('commentModal').classList.remove('active');
      }
    }

    async function submitComment() {
      const author = document.getElementById('commentAuthorInput').value.trim() || 'Viewer';
      const text = document.getElementById('commentTextInput').value.trim();
      if (!text) return;

      const feed = document.getElementById('commentsFeed');
      const emptyMsg = feed.querySelector('p');
      if (emptyMsg) emptyMsg.remove();

      const newItem = document.createElement('div');
      newItem.className = 'comment-item';
      newItem.innerHTML = `<strong class="comment-author">${escapeHtml(author)}:</strong> <span>${escapeHtml(text)}</span>`;
      feed.insertBefore(newItem, feed.firstChild);

      if (supabaseClient) {
        await supabaseClient.from('reactions').insert({
          expression_id: expressionId,
          kind: 'comment',
          author,
          text
        });
      }

      document.getElementById('commentTextInput').value = '';
      closeCommentModal();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    initSupabase();
  </script>
</body>

</html>
