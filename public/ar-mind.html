<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Pure Markerless WebAR View — Cosmic Butterfly</title>

  <!-- A-Frame 1.3.0 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- MindAR Engine for Pure Markerless Image Tracking (Hosted Locally) -->
  <script src="/js/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0b0b12 !important;
    }

    video,
    canvas,
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    .ui-header {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="ui-header">
    <div style="font-weight: 800; font-size: 16px;" id="expTitle">Cosmic Butterfly</div>
    <div style="color: #a78bfa; font-size: 12px; margin-top: 2px;" id="expCaption">✨ Point camera at clean butterfly artwork</div>
  </div>

  <a-scene mindar-image="imageTargetSrc: /data/targets/cosmic-butterfly.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <img id="butterflyTex" src="/overlays/cosmic-butterfly.svg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Lighting for rich 3D metallic highlights -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.95;"></a-entity>
    <a-entity light="type: directional; color: #a78bfa; intensity: 1.5;" position="1 2 3"></a-entity>

    <!-- Target 0 Anchor: Point camera at the 100% clean cosmic butterfly image -->
    <a-entity mindar-image-target="targetIndex: 0" id="mindTarget">
      <!-- 3D Floating Banner Badge -->
      <a-text value="✨ 3D COSMIC AR ACTIVE ✨" position="0 1.1 0.3" align="center" color="#34d399" scale="1.4 1.4 1.4"></a-text>

      <!-- Giant Spinning 3D Neon Torus Knot -->
      <a-torus-knot position="0 0 0.35" radius="0.55" radius-tubular="0.04" material="color: #F472B6; metalness: 0.9; roughness: 0.1" animation="property: rotation; to: 360 360 0; dur: 3500; loop: true; easing: linear"></a-torus-knot>

      <!-- Outer Giant Rotating Green Energy Ring -->
      <a-torus position="0 0 0.15" radius="1.1" radius-tubular="0.05" material="color: #34D399; metalness: 0.9; roughness: 0.1" animation="property: rotation; to: 0 0 360; dur: 2500; loop: true; easing: linear"></a-torus>

      <!-- Left Wing Pivot (Body Hinge at X=0, Y=0, Z=0.1) -->
      <a-entity id="leftWingPivot" position="0 0 0.1" animation="property: rotation; from: 0 0 0; to: 0 50 0; dir: alternate; dur: 600; loop: true; easing: easeInOutSine">
        <!-- Left Wing Plane (2x Larger for High Visibility) -->
        <a-plane position="-0.5 0 0" width="1.0" height="1.3" material="shader: flat; src: #butterflyTex; transparent: true; opacity: 0.95"></a-plane>
      </a-entity>

      <!-- Right Wing Pivot (Body Hinge at X=0, Y=0, Z=0.1) -->
      <a-entity id="rightWingPivot" position="0 0 0.1" animation="property: rotation; from: 0 0 0; to: 0 -50 0; dir: alternate; dur: 600; loop: true; easing: easeInOutSine">
        <!-- Right Wing Plane (2x Larger for High Visibility) -->
        <a-plane position="0.5 0 0" width="1.0" height="1.3" material="shader: flat; src: #butterflyTex; transparent: true; opacity: 0.95"></a-plane>
      </a-entity>

      <!-- Floating 3D Glowing Spheres -->
      <a-sphere position="-0.8 0.6 0.2" radius="0.15" material="color: #38BDF8; metalness: 0.9" animation="property: position; from: -0.8 0.6 0.2; to: -0.8 0.85 0.3; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-sphere>
      <a-sphere position="0.8 0.6 0.2" radius="0.15" material="color: #A78BFA; metalness: 0.9" animation="property: position; from: 0.8 0.6 0.2; to: 0.8 0.85 0.3; dir: alternate; dur: 1050; loop: true; easing: easeInOutSine"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    const targetEntity = document.getElementById('mindTarget');
    if (targetEntity) {
      targetEntity.addEventListener('targetFound', () => {
        console.log('MindAR Pure Image Target Found!');
        const captionEl = document.getElementById('expCaption');
        if (captionEl) captionEl.textContent = '✨ AR Pure Markerless Active!';
      });
      targetEntity.addEventListener('targetLost', () => {
        console.log('MindAR Target Lost!');
        const captionEl = document.getElementById('expCaption');
        if (captionEl) captionEl.textContent = '✨ Point camera at clean butterfly artwork';
      });
    }
  </script>
</body>

</html>
