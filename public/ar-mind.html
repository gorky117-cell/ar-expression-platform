<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Pure Markerless WebAR View — Cosmic Butterfly</title>

  <!-- A-Frame 1.3.0 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- MindAR Engine for Pure Markerless Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0b0b12 !important;
    }

    video,
    canvas,
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    .ui-header {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="ui-header">
    <div style="font-weight: 800; font-size: 16px;" id="expTitle">Cosmic Butterfly</div>
    <div style="color: #a78bfa; font-size: 12px; margin-top: 2px;" id="expCaption">✨ Point camera at clean butterfly artwork</div>
  </div>

  <a-scene mindar-image="imageTargetSrc: /data/targets/cosmic-butterfly.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <img id="butterflyTex" src="/overlays/cosmic-butterfly.svg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0 Anchor: Point camera at the 100% clean cosmic butterfly image -->
    <a-entity mindar-image-target="targetIndex: 0" id="mindTarget">
      <!-- Outer Glowing Constellation Aura -->
      <a-circle position="0 0 0.01" radius="0.75" material="shader: flat; color: #7C5CFF; transparent: true; opacity: 0.4" animation="property: scale; from: 0.9 0.9 0.9; to: 1.2 1.2 1.2; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine"></a-circle>

      <!-- True AR Overlay: Animated 3D Flapping Left Wing -->
      <a-plane position="-0.2 0 0.05" width="0.55" height="0.75" material="shader: flat; src: #butterflyTex; transparent: true; opacity: 0.92" animation="property: rotation; from: 0 0 0; to: 0 30 0; dir: alternate; dur: 750; loop: true; easing: easeInOutQuad"></a-plane>

      <!-- True AR Overlay: Animated 3D Flapping Right Wing -->
      <a-plane position="0.2 0 0.05" width="0.55" height="0.75" material="shader: flat; src: #butterflyTex; transparent: true; opacity: 0.92" animation="property: rotation; from: 0 0 0; to: 0 -30 0; dir: alternate; dur: 750; loop: true; easing: easeInOutQuad"></a-plane>

      <!-- Glowing Energy Core over Butterfly Body -->
      <a-sphere position="0 0 0.08" radius="0.18" material="color: #F472B6; metalness: 0.9; roughness: 0.1" animation="property: scale; from: 0.8 0.8 0.8; to: 1.3 1.3 1.3; dir: alternate; dur: 1100; loop: true; easing: easeInOutSine"></a-sphere>

      <!-- Floating Constellation Sparkles -->
      <a-sphere position="-0.45 0.35 0.1" radius="0.08" material="color: #38BDF8; metalness: 0.8" animation="property: position; from: -0.45 0.35 0.1; to: -0.45 0.5 0.15; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"></a-sphere>
      <a-sphere position="0.45 0.35 0.1" radius="0.08" material="color: #A78BFA; metalness: 0.8" animation="property: position; from: 0.45 0.35 0.1; to: 0.45 0.5 0.15; dir: alternate; dur: 1050; loop: true; easing: easeInOutSine"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    const targetEntity = document.getElementById('mindTarget');
    if (targetEntity) {
      targetEntity.addEventListener('targetFound', () => {
        console.log('MindAR Pure Image Target Found!');
        const captionEl = document.getElementById('expCaption');
        if (captionEl) captionEl.textContent = '✨ AR Pure Markerless Active!';
      });
      targetEntity.addEventListener('targetLost', () => {
        console.log('MindAR Target Lost!');
        const captionEl = document.getElementById('expCaption');
        if (captionEl) captionEl.textContent = '✨ Point camera at clean butterfly artwork';
      });
    }
  </script>
</body>

</html>
