<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <title>AR Social Expression — AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    /* Digital zoom scale trick to increase AR scanning range by 30% */
    video, #arjs-video {
      transform: scale(1.3) !important;
      transform-origin: center !important;
    }
    .instruction { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.6); padding: 10px 16px; border-radius: 8px; font-family: system-ui; font-size: 14px; z-index: 999; text-align: center; max-width: 90%; }
    .caption { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.5); padding: 8px 14px; border-radius: 8px; font-family: system-ui; font-size: 13px; z-index: 999; text-align: center; max-width: 85%; }
  </style>
</head>
<body>
  <div id="captionEl" class="caption" style="display: none;"></div>
  <div class="instruction">Point your camera at the Hiro marker. Tree and birds appear in AR.</div>
  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; maxDetectionRate: 60;">
    <a-assets>
      <img id="overlayTex" src="overlays/tree-birds.svg">
      <img id="birdTex" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2334d399' opacity='0.9'/%3E%3Cellipse cx='32' cy='28' rx='8' ry='10' fill='%23fff'/%3E%3Cpath d='M20 32 Q32 24 44 32' stroke='%231a1a20' stroke-width='2' fill='none'/%3E%3C/svg%3E">
    </a-assets>
    <a-marker type="pattern" url="https://raw.githack.com/AR-js-org/AR.js/master/data/data/hiro.patt">
      <!-- Grounding Shadow: Cast directly on the print (Z=0.01) -->
      <a-circle position="0 0 0.01" rotation="-90 0 0" radius="0.45" material="shader: flat; color: #000000; transparent: true; opacity: 0.35"></a-circle>

      <!-- Main Expression Overlay: Leaned forward (-75deg) and floating (Z=0.15) -->
      <a-plane position="0 0 0.15" rotation="-75 0 0" width="0.9" height="0.9" material="shader: flat; src: #overlayTex; transparent: true;" animation="property: rotation; to: -70 4 2; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine"></a-plane>
      
      <!-- Sub-Asset Layer 1: Floating high (Z=0.28) and drifting left -->
      <a-plane position="0.3 0.2 0.28" rotation="-75 0 0" width="0.25" height="0.2" material="shader: flat; src: #birdTex; transparent: true; opacity: 0.9" animation="property: position; to: 0.42 0.32 0.28; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine"></a-plane>
      
      <!-- Sub-Asset Layer 2: Floating medium (Z=0.22) and drifting right -->
      <a-plane position="-0.25 0.12 0.22" rotation="-75 0 0" width="0.18" height="0.13" material="shader: flat; src: #birdTex; transparent: true; opacity: 0.85" animation="property: position; to: -0.35 0.25 0.22; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine"></a-plane>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var overlayUrl = params.get('overlay');
      if (overlayUrl) {
        var img = document.getElementById('overlayTex');
        if (img) img.src = overlayUrl;
      }
      var caption = params.get('caption') || params.get('mood');
      var el = document.getElementById('captionEl');
      if (el && caption) {
        el.textContent = decodeURIComponent(caption);
        el.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
