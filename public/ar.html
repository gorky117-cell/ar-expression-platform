<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>AR Social Expression — AR View</title>
  
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- AR.js Pattern Marker Engine -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Digital zoom scale trick to increase AR scanning range by 30% */
    video, #arjs-video {
      transform: scale(1.3) !important;
      transform-origin: center !important;
    }

    /* Style for AR.js loader */
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(18, 18, 24, 0.95) !important;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arjs-loader div {
      text-align: center;
      font-size: 1.2em;
      color: white;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    
    /* Glassmorphism Floating UI */
    .glass-ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 16px 20px;
    }
    
    .ui-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      width: 100%;
    }
    
    /* Floating Title Card */
    .expression-card {
      pointer-events: auto;
      background: rgba(18, 18, 24, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 10px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      max-width: 70%;
    }
    
    .expression-title {
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.01em;
    }
    
    .expression-caption {
      color: #8888a0;
      font-size: 11px;
      margin: 2px 0 0 0;
    }
    
    .expression-vibe-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      background: rgba(124, 92, 255, 0.25);
      border: 1px solid rgba(124, 92, 255, 0.4);
      border-radius: 20px;
      color: #a78bfa;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .close-btn {
      pointer-events: auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(18, 18, 24, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      font-size: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    
    .ui-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      pointer-events: none;
    }
    
    /* Comments Feed Drawer */
    .comments-drawer {
      pointer-events: auto;
      background: rgba(18, 18, 24, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 12px 14px;
      max-width: 60%;
      max-height: 180px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .comments-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
      padding-right: 4px;
    }

    .comment-item {
      font-size: 11px;
      line-height: 1.3;
      color: #e2e8f0;
      word-break: break-word;
    }
    .comment-author {
      font-weight: 700;
      color: #a78bfa;
      margin-right: 4px;
    }
    
    /* Social Action Sidebar */
    .action-sidebar {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    
    .action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(18, 18, 24, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, background 0.15s ease;
      position: relative;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-btn.liked {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
    }
    
    .action-icon {
      font-size: 18px;
    }
    
    .action-count {
      font-size: 9px;
      font-weight: 700;
      color: #a78bfa;
      position: absolute;
      bottom: -16px;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: #181820;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }

    .modal-title {
      margin: 0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .modal-input {
      width: 100%;
      background: #0f0f14;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }

    .modal-input:focus {
      border-color: #7c5cff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
    }

    .modal-btn-cancel {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .modal-btn-submit {
      background: #7c5cff;
      color: #fff;
    }

    /* Force WebGL canvas transparency to expose camera stream underneath */
    a-scene, canvas.a-canvas {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div class="arjs-loader">
    <div>Loading AR experience, please wait...</div>
  </div>
  <!-- Overlay Controls (on top of Camera) -->
  <div class="glass-ui">
    <div class="ui-top">
      <div class="expression-card">
        <h2 id="expTitle" class="expression-title">Active Expression</h2>
        <p id="expCaption" class="expression-caption">Initializing AR overlay…</p>
        <div id="expVibe" class="expression-vibe-badge">CALM</div>
      </div>
      <a href="/feed" class="close-btn" title="Back to Feed">✕</a>
    </div>
    
    <div class="ui-bottom">
      <!-- Live Comments Feed -->
      <div class="comments-drawer">
        <div id="commentsList" class="comments-list">
          <div class="comment-item"><span class="comment-author">System</span>Point camera at the AR corner tag</div>
        </div>
      </div>
      
      <!-- Interactive Action Buttons -->
      <div class="action-sidebar">
        <button id="likeBtn" class="action-btn" onclick="handleLike(event)">
          <span class="action-icon">❤️</span>
          <span id="likeCount" class="action-count">0</span>
        </button>
        <button id="greetBtn" class="action-btn" onclick="handleGreet(event)">
          <span class="action-icon">👋</span>
          <span id="greetCount" class="action-count">0</span>
        </button>
        <button class="action-btn" onclick="openCommentModal(event)">
          <span class="action-icon">💬</span>
          <span style="font-size: 8px; color: #8888a0; position: absolute; bottom: -16px;">Reply</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Comment Submission Modal -->
  <div id="commentModal" class="modal-overlay" onclick="closeCommentModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 class="modal-title">Leave a Comment</h3>
      <input type="text" id="commentAuthorInput" class="modal-input" placeholder="Your name (optional)" maxlength="20" />
      <textarea id="commentTextInput" class="modal-input" placeholder="Type your message..." rows="3" maxlength="120" style="resize:none;"></textarea>
      <div class="modal-actions">
        <button onclick="closeCommentModal()" class="modal-btn modal-btn-cancel">Cancel</button>
        <button id="submitCommentBtn" onclick="submitComment()" class="modal-btn modal-btn-submit">Post</button>
      </div>
    </div>
  </div>

  <!-- Pre-calculate URL parameters before scene parsing -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const overlayUrl = params.get('overlay');
    const mood = (params.get('mood') || 'calm').toLowerCase();
    const caption = params.get('caption');
  </script>

  <!-- A-Frame WebAR Scene with High-Speed Pattern Marker -->
  <a-scene 
    vr-mode-ui="enabled: false;"
    renderer="alpha: true; antialias: true;"
    embedded 
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
    <a-assets>
      <img id="overlayTex" src="overlays/tree-birds.svg">
      <img id="birdTex" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2334d399' opacity='0.9'/%3E%3Cellipse cx='32' cy='28' rx='8' ry='10' fill='%23fff'/%3E%3Cpath d='M20 32 Q32 24 44 32' stroke='%231a1a20' stroke-width='2' fill='none'/%3E%3C/svg%3E">
    </a-assets>

    <!-- Instant Pattern Marker (Tracks corner Hiro Tag, offsets 3D overlay directly over the tree) -->
    <a-marker preset="hiro" id="nftTrigger">
      <a-entity position="-1.2 0.2 -0.8" scale="1.8 1.8 1.8">
        <!-- Grounding Shadow -->
        <a-circle position="0 0.01 0" rotation="-90 0 0" radius="0.6" material="shader: flat; color: #000000; transparent: true; opacity: 0.3"></a-circle>

        <!-- Main Expression Overlay -->
        <a-plane id="mainOverlayNft" position="0 0.2 0" rotation="-75 0 0" width="1.2" height="1.2" material="shader: flat; src: #overlayTex; transparent: true;"></a-plane>
        
        <!-- Sub-Asset Layer 1 -->
        <a-plane id="bird1Nft" position="0.35 0.45 -0.15" rotation="-75 0 0" width="0.3" height="0.24" material="shader: flat; src: #birdTex; transparent: true; opacity: 0.9"></a-plane>
        
        <!-- Sub-Asset Layer 2 -->
        <a-plane id="bird2Nft" position="-0.3 0.35 0.15" rotation="-75 0 0" width="0.22" height="0.16" material="shader: flat; src: #birdTex; transparent: true; opacity: 0.85"></a-plane>
      </a-entity>
    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Script Logic -->
  <script>
    function injectAnimations() {
      const mainPlaneNft = document.getElementById('mainOverlayNft');
      const b1Nft = document.getElementById('bird1Nft');
      const b2Nft = document.getElementById('bird2Nft');

      const apply = (p, b_1, b_2) => {
        if (!p || !b_1 || !b_2) return;
        
        if (mood === 'playful') {
          // Playful: Bouncy float, elastic scale pulse, and wobbly rotation
          p.setAttribute('animation__float', 'property: position; from: 0 0.18 0; to: 0 0.45 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutQuad');
          p.setAttribute('animation__rotate', 'property: rotation; from: -75 -12 0; to: -75 12 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine');
          p.setAttribute('animation__scale', 'property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dir: alternate; dur: 750; loop: true; easing: easeInOutSine');
          
          b_1.setAttribute('animation__drift1', 'property: position; from: 0.35 0.45 -0.15; to: 0.52 0.62 -0.15; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine');
          b_2.setAttribute('animation__drift2', 'property: position; from: -0.3 0.35 0.15; to: -0.45 0.5 0.15; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine');
        } else if (mood === 'happy') {
          // Happy: High-frequency scaling (breathing) and energetic float
          p.setAttribute('animation__float', 'property: position; from: 0 0.2 0; to: 0 0.4 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutQuad');
          p.setAttribute('animation__scale', 'property: scale; from: 0.95 0.95 0.95; to: 1.15 1.15 1.15; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine');
          p.setAttribute('animation__rotate', 'property: rotation; from: -75 0 -4; to: -75 0 4; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine');
          
          b_1.setAttribute('animation__drift1', 'property: position; from: 0.35 0.45 -0.15; to: 0.5 0.6 -0.15; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine');
          b_2.setAttribute('animation__drift2', 'property: position; from: -0.3 0.35 0.15; to: -0.42 0.5 0.15; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine');
        } else if (mood === 'inspired') {
          // Inspired: Twist/yaw and vertical float
          p.setAttribute('animation__float', 'property: position; from: 0 0.15 0; to: 0 0.35 0; dir: alternate; dur: 3800; loop: true; easing: easeInOutSine');
          p.setAttribute('animation__rotate', 'property: rotation; from: -78 -8 5; to: -68 8 -5; dir: alternate; dur: 4200; loop: true; easing: easeInOutSine');
          
          b_1.setAttribute('animation__drift1', 'property: position; from: 0.35 0.45 -0.15; to: 0.46 0.58 -0.15; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine');
          b_2.setAttribute('animation__drift2', 'property: position; from: -0.3 0.35 0.15; to: -0.38 0.48 0.15; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine');
        } else if (mood === 'peaceful' || mood === 'calm' || mood === 'relaxed') {
          // Peaceful: Very slow, gentle drift
          p.setAttribute('animation__float', 'property: position; from: 0 0.18 0; to: 0 0.28 0; dir: alternate; dur: 5500; loop: true; easing: easeInOutSine');
          p.setAttribute('animation__rotate', 'property: rotation; from: -76 -2 1; to: -72 2 -1; dir: alternate; dur: 4800; loop: true; easing: easeInOutSine');
          
          b_1.setAttribute('animation__drift1', 'property: position; from: 0.35 0.45 -0.15; to: 0.45 0.52 -0.15; dir: alternate; dur: 3800; loop: true; easing: easeInOutSine');
          b_2.setAttribute('animation__drift2', 'property: position; from: -0.3 0.35 0.15; to: -0.36 0.42 0.15; dir: alternate; dur: 4200; loop: true; easing: easeInOutSine');
        } else {
          // Default: Steady gentle floating
          p.setAttribute('animation__float', 'property: position; from: 0 0.2 0; to: 0 0.35 0; dir: alternate; dur: 3200; loop: true; easing: easeInOutSine');
          p.setAttribute('animation__rotate', 'property: rotation; from: -75 -4 2; to: -70 4 -2; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine');
          
          b_1.setAttribute('animation__drift1', 'property: position; from: 0.35 0.45 -0.15; to: 0.48 0.58 -0.15; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine');
          b_2.setAttribute('animation__drift2', 'property: position; from: -0.3 0.35 0.15; to: -0.4 0.48 0.15; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine');
        }
      };

      apply(mainPlaneNft, b1Nft, b2Nft);
    }

    const scene = document.querySelector('a-scene');
    if (scene.hasLoaded) {
      injectAnimations();
    } else {
      scene.addEventListener('loaded', injectAnimations);
    }

    // Inject visual overlay immediately from query params
    if (overlayUrl) {
      document.getElementById('overlayTex').src = overlayUrl;
    }
    
    // Set static UI text immediately
    const titleEl = document.getElementById('expTitle');
    const captionEl = document.getElementById('expCaption');
    
    if (caption) {
      captionEl.textContent = `"${decodeURIComponent(caption)}"`;
    } else {
      captionEl.textContent = `Vibe: ${mood.toUpperCase()}`;
    }

    let supabaseClient = null;

    // Load Supabase credentials and initialize client
    async function initSupabase() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.supabaseUrl && config.supabaseKey) {
          supabaseClient = supabase.createClient(config.supabaseUrl, config.supabaseKey);
          
          if (id) {
            // Load custom expression name if DB connected
            const { data: expr } = await supabaseClient.from('expressions').select('name').eq('id', id).single();
            if (expr && expr.name) {
              titleEl.textContent = expr.name;
            }
            
            // Poll comments and reactions
            pollData();
            setInterval(pollData, 3000);
          } else {
            document.getElementById('commentsFeed').innerHTML = '<p style="color:#7a7f90; font-size:11px; margin:0; font-style:italic;">No expression ID provided.</p>';
          }
        } else {
          showOfflineFallback();
        }
      } catch (err) {
        console.error('Failed to init Supabase:', err);
        showOfflineFallback();
      }
    }

    function showOfflineFallback() {
      document.getElementById('commentsFeed').innerHTML = '<p style="color:#7a7f90; font-size:11px; margin:0; font-style:italic;">Running in offline fallback mode.</p>';
    }

    async function pollData() {
      if (!supabaseClient || !id) return;
      try {
        const { data: reactions, error } = await supabaseClient
          .from('reactions')
          .select('*')
          .eq('expression_id', id);
        
        if (error) throw error;
        
        const likes = reactions.filter(r => r.kind === 'like').length;
        const greetings = reactions.filter(r => r.kind === 'greeting').length;
        const comments = reactions.filter(r => r.kind === 'comment')
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        
        document.getElementById('likeCount').textContent = likes;
        document.getElementById('waveCount').textContent = greetings;
        
        const feed = document.getElementById('commentsFeed');
        if (comments.length === 0) {
          feed.innerHTML = '<p style="color:#7a7f90; font-size:11px; margin:0; font-style:italic;">No comments yet. Be the first!</p>';
        } else {
          feed.innerHTML = comments.map(c => `
            <div class="comment-item">
              <strong class="comment-author">${escapeHtml(c.author || 'Viewer')}</strong>
              <span class="comment-text">${escapeHtml(c.text || '')}</span>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    async function handleLike() {
      if (!supabaseClient || !id) return;
      try {
        const el = document.getElementById('likeCount');
        el.textContent = parseInt(el.textContent) + 1;
        await supabaseClient.from('reactions').insert({ expression_id: id, kind: 'like' });
        pollData();
      } catch (err) {
        console.error('Like failed:', err);
      }
    }

    async function handleWave() {
      if (!supabaseClient || !id) return;
      try {
        const el = document.getElementById('waveCount');
        el.textContent = parseInt(el.textContent) + 1;
        await supabaseClient.from('reactions').insert({ expression_id: id, kind: 'greeting' });
        pollData();
      } catch (err) {
        console.error('Wave failed:', err);
      }
    }

    function openCommentModal() {
      document.getElementById('commentModal').classList.add('active');
    }

    function closeCommentModal(event) {
      if (!event || event.target === document.getElementById('commentModal') || event.target.classList.contains('modal-btn-cancel')) {
        document.getElementById('commentModal').classList.remove('active');
      }
    }

    async function submitComment() {
      const author = document.getElementById('commentAuthorInput').value.trim() || 'Viewer';
      const text = document.getElementById('commentTextInput').value.trim();
      if (!text) return;
      
      if (!supabaseClient || !id) return;
      try {
        const btn = document.getElementById('submitCommentBtn');
        btn.disabled = true;
        btn.textContent = 'Posting...';

        await supabaseClient.from('reactions').insert({
          expression_id: id,
          kind: 'comment',
          author,
          text
        });
        
        closeCommentModal();
        document.getElementById('commentTextInput').value = '';
        btn.disabled = false;
        btn.textContent = 'Post';
        pollData();
      } catch (err) {
        console.error('Post failed:', err);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Run init
    initSupabase();
  </script>
</body>
</html>
